services:
  - type: web
    name: live-cutter
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: live-cutter-data
      mountPath: /app/backend/data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /app/backend/data
      - key: COOKIE_SECURE
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: GROQ_API_KEY_5
        sync: false
      - key: GROQ_API_KEY_6
        sync: false
      - key: GROQ_API_KEY_7
        sync: false
      - key: OPENAI_API_KEY
        sync: false
