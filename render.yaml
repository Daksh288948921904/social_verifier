services:
  - type: web
    name: live-cutter
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /app/backend/data
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: live-cutter-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: GROQ_API_KEY_5
        sync: false
      - key: GROQ_API_KEY_6
        sync: false
      - key: GROQ_API_KEY_7
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Footage + Search tabs: YouTube Data API search. Without it, search
      # falls back to yt-dlp, which YouTube often blocks from Render's IPs.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_CX
        sync: false
      # Path to a YouTube cookies.txt uploaded as a Render Secret File
      # (e.g. /etc/secrets/youtube_cookies.txt) -- lets yt-dlp fetch captions
      # and cut clips when YouTube asks Render's IPs to "sign in".
      - key: YTDLP_YOUTUBE_COOKIES_FILE
        sync: false

databases:
  - name: live-cutter-db
    plan: free
    databaseName: live_cutter
    user: live_cutter
